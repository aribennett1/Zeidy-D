name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:search
      - run: node build-pdf-version.js
      - uses: actions/configure-pages@v5
      - name: Prepare public assets
        run: |
          mkdir _site
          cp -R index.html 404.html .nojekyll CNAME styles.css script.js site-search.mjs search-text.mjs search-index.json pdf-reader.css pdf-reader.mjs pdf-position.mjs pdf-version.json pdf-versions vendor Files manifest.json routes.json favicon.png Thumbnail.jpg 404.mp4 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
