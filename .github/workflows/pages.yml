name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:search
      - run: node build-pdf-version.js
      - uses: actions/configure-pages@v5
      - name: Prepare public assets
        run: |
          mkdir _site
          cp -R index.html 404.html .nojekyll CNAME styles.css script.js site-search.mjs site-search.css search-text.mjs search-aliases.mjs search-index.json pdf-reader.css pdf-reader.mjs pdf-position.mjs pdf-version.json pdf-versions vendor Files manifest.json routes.json favicon.png Thumbnail.jpg 404.mp4 _site/
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          for attempt in {1..10}; do
            if artifact_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id'); then
              if grep -Fxq "$ARTIFACT_ID" <<< "$artifact_ids"; then
                echo "Pages artifact $ARTIFACT_ID is visible."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "Waiting for Pages artifact visibility (attempt $attempt/10)."
              sleep 3
            fi
          done
          echo "::error::Uploaded Pages artifact $ARTIFACT_ID is not visible in the workflow artifacts API."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
